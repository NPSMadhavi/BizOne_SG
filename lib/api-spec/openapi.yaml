openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for RSV Infotech PO Generator
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: companies
    description: Company management
  - name: purchase-orders
    description: Purchase order operations
  - name: quotations
    description: Quotation operations
  - name: invoices
    description: Invoice operations
  - name: delivery-orders
    description: Delivery order operations
  - name: settings
    description: Company settings
  - name: stock-items
    description: Stock item operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/select-company:
    post:
      operationId: selectCompany
      tags: [auth]
      summary: Select active company for session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectCompanyBody"
      responses:
        "200":
          description: Company selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List all companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      tags: [purchase-orders]
      summary: List purchase orders
      responses:
        "200":
          description: List of purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      operationId: createPurchaseOrder
      tags: [purchase-orders]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderBody"
      responses:
        "201":
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      tags: [purchase-orders]
      summary: Get a purchase order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    put:
      operationId: updatePurchaseOrder
      tags: [purchase-orders]
      summary: Update a purchase order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseOrderBody"
      responses:
        "200":
          description: Purchase order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    delete:
      operationId: deletePurchaseOrder
      tags: [purchase-orders]
      summary: Delete a purchase order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /purchase-orders/stats:
    get:
      operationId: getPurchaseOrderStats
      tags: [purchase-orders]
      summary: Get PO stats summary
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: List quotations
      responses:
        "200":
          description: List of quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Create a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationBody"
      responses:
        "201":
          description: Quotation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/stats:
    get:
      operationId: getQuotationStats
      tags: [quotations]
      summary: Get quotation stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocStats"

  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: Get a quotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    put:
      operationId: updateQuotation
      tags: [quotations]
      summary: Update a quotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationBody"
      responses:
        "200":
          description: Quotation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete a quotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocStats"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    put:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /invoices/{id}/void:
    post:
      operationId: voidInvoice
      tags: [invoices]
      summary: Void an invoice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                voidReason:
                  type: string
              required: [voidReason]
      responses:
        "200":
          description: Invoice voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/knock-off:
    post:
      operationId: knockOffInvoice
      tags: [invoices]
      summary: Mark invoice as paid (knock off)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /delivery-orders:
    get:
      operationId: listDeliveryOrders
      tags: [delivery-orders]
      summary: List delivery orders
      responses:
        "200":
          description: List of delivery orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryOrder"
    post:
      operationId: createDeliveryOrder
      tags: [delivery-orders]
      summary: Create a delivery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryOrderBody"
      responses:
        "201":
          description: Delivery order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrder"

  /delivery-orders/{id}:
    get:
      operationId: getDeliveryOrder
      tags: [delivery-orders]
      summary: Get a delivery order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrder"
    put:
      operationId: updateDeliveryOrder
      tags: [delivery-orders]
      summary: Update a delivery order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryOrderBody"
      responses:
        "200":
          description: Delivery order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryOrder"
    delete:
      operationId: deleteDeliveryOrder
      tags: [delivery-orders]
      summary: Delete a delivery order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /stock-items:
    get:
      operationId: listStockItems
      tags: [stock-items]
      summary: List stock items for current company
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [product, service]
      responses:
        "200":
          description: List of stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"
    post:
      operationId: createStockItem
      tags: [stock-items]
      summary: Create a stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"

  /stock-items/{id}:
    get:
      operationId: getStockItem
      tags: [stock-items]
      summary: Get a stock item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
    put:
      operationId: updateStockItem
      tags: [stock-items]
      summary: Update a stock item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
    delete:
      operationId: deleteStockItem
      tags: [stock-items]
      summary: Delete a stock item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        address:
          type: string
        registrationNo:
          type: string
        email:
          type: string
        phone:
          type: string
      required: [id, name, country]

    UserCompany:
      type: object
      description: Company with per-company module access list for the user
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        address:
          type: string
        registrationNo:
          type: string
        email:
          type: string
        phone:
          type: string
        modules:
          type: array
          items:
            type: string
      required: [id, name, country, modules]

    CompanyAccessItem:
      type: object
      description: Company ID with list of allowed modules for that company
      properties:
        companyId:
          type: integer
        modules:
          type: array
          items:
            type: string
      required: [companyId, modules]

    SelectCompanyBody:
      type: object
      properties:
        companyId:
          type: integer
      required: [companyId]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, user, external]
        createdAt:
          type: string
        companies:
          type: array
          items:
            $ref: "#/components/schemas/UserCompany"
        selectedCompanyId:
          type: integer
      required: [id, username, role, createdAt, companies]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, user, external]
        companyAccess:
          type: array
          items:
            $ref: "#/components/schemas/CompanyAccessItem"
      required: [username, password, role]

    UpdateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, user, external]
        companyAccess:
          type: array
          items:
            $ref: "#/components/schemas/CompanyAccessItem"

    POItem:
      type: object
      properties:
        partNumber:
          type: string
        description:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        amount:
          type: number
      required: [partNumber, description, qty, unitPrice, amount]

    PurchaseOrder:
      type: object
      properties:
        id:
          type: integer
        poNumber:
          type: string
        vendorName:
          type: string
        vendorAddress:
          type: string
        vendorContact:
          type: string
        vendorContactEmail:
          type: string
        deliveryAddress:
          type: string
        deliveryDate:
          type: string
        paymentTerms:
          type: string
        quoteRefNo:
          type: string
        notes:
          type: string
        currency:
          type: string
        isPrivate:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/POItem"
        subtotal:
          type: number
        tax:
          type: number
        totalAmount:
          type: number
        status:
          type: string
          enum: [draft, confirmed, cancelled]
        createdBy:
          type: integer
        createdByUsername:
          type: string
        createdAt:
          type: string
      required: [id, poNumber, vendorName, items, subtotal, tax, totalAmount, status, createdBy, createdAt]

    CreatePurchaseOrderBody:
      type: object
      properties:
        vendorName:
          type: string
        vendorAddress:
          type: string
        vendorContact:
          type: string
        vendorContactEmail:
          type: string
        deliveryAddress:
          type: string
        deliveryDate:
          type: string
        paymentTerms:
          type: string
        quoteRefNo:
          type: string
        notes:
          type: string
        currency:
          type: string
        isPrivate:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/POItem"
        tax:
          type: number
        status:
          type: string
          enum: [draft, confirmed, cancelled]
      required: [vendorName, items]

    UpdatePurchaseOrderBody:
      type: object
      properties:
        vendorName:
          type: string
        vendorAddress:
          type: string
        vendorContact:
          type: string
        vendorContactEmail:
          type: string
        deliveryAddress:
          type: string
        deliveryDate:
          type: string
        paymentTerms:
          type: string
        quoteRefNo:
          type: string
        notes:
          type: string
        currency:
          type: string
        isPrivate:
          type: boolean
        status:
          type: string
          enum: [draft, confirmed, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/POItem"
        tax:
          type: number
      required: [vendorName, items]

    POStats:
      type: object
      properties:
        total:
          type: integer
        confirmed:
          type: integer
        draft:
          type: integer
        cancelled:
          type: integer
        totalValue:
          type: number
      required: [total, confirmed, draft, cancelled, totalValue]

    Settings:
      type: object
      properties:
        id:
          type: integer
        gstRate:
          type: number
        smtpHost:
          type: string
        smtpPort:
          type: string
        smtpUser:
          type: string
        smtpFrom:
          type: string
        smtpConfigured:
          type: boolean
        poPrefix:
          type: string
        poCounter:
          type: integer
        poSuffix:
          type: string
        invPrefix:
          type: string
        invCounter:
          type: integer
        invSuffix:
          type: string
        qtPrefix:
          type: string
        qtCounter:
          type: integer
        qtSuffix:
          type: string
        doPrefix:
          type: string
        doCounter:
          type: integer
        doSuffix:
          type: string
        grnPrefix:
          type: string
        grnCounter:
          type: integer
        grnSuffix:
          type: string
        allowNegativeStock:
          type: boolean
        autoDeductOnDo:
          type: boolean
        lowStockWarning:
          type: number
        defaultUom:
          type: string
        bankDetails:
          type: string
        termsAndConditions:
          type: string
      required: [id, gstRate]

    UpdateSettingsBody:
      type: object
      properties:
        gstRate:
          type: number
        smtpHost:
          type: string
        smtpPort:
          type: string
        smtpUser:
          type: string
        smtpPass:
          type: string
        smtpFrom:
          type: string
        poPrefix:
          type: string
        poCounter:
          type: integer
        poSuffix:
          type: string
        invPrefix:
          type: string
        invCounter:
          type: integer
        invSuffix:
