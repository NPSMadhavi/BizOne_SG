name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Replit
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                description: 'Replit production deploy',
                auto_merge: false,
                required_contexts: [],
              });

              // Status 202 means GitHub queued it but didn't create the deployment yet
              // (e.g. pending merge). In that case data.id is absent — skip status update.
              if (!deployment.data.id) {
                core.warning('Deployment not created (likely a 202 response). Skipping status update.');
                return;
              }

              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                description: 'CI passed — publish via Replit Publish button to go live',
                environment_url: 'https://replit.com',
              });
            } catch (err) {
              core.warning(`Deployment step failed (non-fatal): ${err.message}`);
            }
