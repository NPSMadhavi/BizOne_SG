kind = "web"
previewPath = "/"
title = "RSV Infotech PO Generator"
version = "1.0.0"
id = "artifacts/po-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23329

[services.development]
run = "pnpm --filter @workspace/po-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/po-app", "run", "build" ]
publicDir = "artifacts/po-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23329"
BASE_PATH = "/"
